name: Publish verified Windows installer

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Windows build run to publish
        required: true
        default: '44482831726'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify source build
        id: verified
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/build.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'build.json').read_text())
          assert run['conclusion'] == 'success', 'Build must be successful'
          assert run['head_branch'] == 'main', 'Only main branch builds can be published'
          assert run['head_repository']['full_name'] == os.environ['GH_REPO'], 'Build must originate in this repository'
          assert run['path'] == '.github/workflows/windows-build.yml', 'Expected the Windows build workflow'
          assert run['event'] in ('push', 'workflow_dispatch'), 'Pull request builds cannot be released'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + run['head_sha'] + '\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: UV-Security-Manager-Windows
          path: release-files
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.build_run_id }}
      - name: Publish installer download
        env:
          VERIFIED_SHA: ${{ steps.verified.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum release-files/installer/UV-Security-Manager-Setup.exe release-files/dist/UV-Security-Manager.exe > release-files/SHA256SUMS.txt
          gh release create v1.0.0 \
            release-files/installer/UV-Security-Manager-Setup.exe \
            release-files/dist/UV-Security-Manager.exe \
            release-files/QUICK-START.txt \
            release-files/SHA256SUMS.txt \
            --target "$VERIFIED_SHA" \
            --title 'UV Security Manager v1.0 - Windows 10/11' \
            --notes-file .github/release-notes.md
